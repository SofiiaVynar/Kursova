<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Автопарк</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
<nav>
    <a href="{{ url_for('web.home') }}">Головна</a>
    <a href="{{ url_for('web.vehicles_page') }}">Автомобілі</a>
    <a href="{{ url_for('web.drivers_page') }}">Водії</a>
    <div class="dropdown">
        <a href="#">Облік</a>
        <div class="dropdown-content">
            <a href="{{ url_for('web.trips_page') }}">Використання транспорту</a>
            <a href="{{ url_for('web.maintenance_page') }}">Технічне обслуговування</a>
            <a href="{{ url_for('web.expenses_page') }}">Витрати</a>
        </div>
    </div>
    <a href="{{ url_for('web.reports_page') }}">Звіти</a>
    {% if current_user.is_authenticated %}
        <a href="{{ url_for('auth.logout') }}">Вийти</a>
    {% else %}
        <a href="{{ url_for('auth.login') }}">Вхід</a>
    {% endif %}
</nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>Contact us: +38 068 456 76 75</p>
</footer>
</body>
</html>
